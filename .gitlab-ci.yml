stages:
  - check
  - publish
  - mirror

check:
  stage: check
  before_script:
    # No container cleanup here: the runner's docker daemon is shared with the
    # live demo, which runs the same images. Testcontainers get generated names
    # and OS-assigned host ports, so a leftover from a killed run can't collide
    # with this one.
    # Refresh ECR Public auth before the pre-pull. The runner is shared with
    # jobs that `docker login public.ecr.aws` to push; once that cached token
    # expires (12h), docker sends the stale token instead of falling back to
    # anonymous and every pull dies with "authorization token has expired".
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    # Pre-pull all e2e images so testcontainers' startup-timeout window only
    # has to cover binary startup, not network image fetch. Saves up to a
    # minute per image on a cold runner; turns "container startup timeout"
    # flakes into instant errors.
    - docker pull public.ecr.aws/y1d2j6a8/mock-modbus-server:latest &
      docker pull public.ecr.aws/y1d2j6a8/mock-snmp-agent:latest &
      docker pull public.ecr.aws/y1d2j6a8/mock-redfish-service:latest &
      docker pull public.ecr.aws/y1d2j6a8/mock-dnp3-outstation:latest &
      docker pull public.ecr.aws/y1d2j6a8/mock-bacnet-device:latest &
      docker pull public.ecr.aws/y1d2j6a8/ems-device-api:latest &
      docker pull postgres:15 &
      docker pull hivemq/hivemq-ce:latest &
      wait
  script:
    - cargo cmd checks
    - cargo nextest run --lib --no-default-features --profile ci --cargo-profile dev --target x86_64-unknown-linux-gnu
    - cargo tarpaulin --skip-clean --lib --no-default-features --exclude-files=src/main.rs --target-dir=target/coverage --out Xml
    - cargo cmd integration
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-industrial-gateway .
    - docker push public.ecr.aws/y1d2j6a8/ems-industrial-gateway
    # Cloud customers run the gateway on-prem — publish a docker-save tarball
    # they download from the delivery portal (`docker load` then run). Fixed
    # key; platform-api's portal links it. Public-read via the gateway/* bucket
    # policy prefix.
    - docker save public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest | gzip > ems-industrial-gateway-latest.tar.gz
    - sha256sum ems-industrial-gateway-latest.tar.gz > ems-industrial-gateway-latest.tar.gz.sha256
    - aws s3 cp ems-industrial-gateway-latest.tar.gz s3://arcnode-public/gateway/ems-industrial-gateway-latest.tar.gz
    - aws s3 cp ems-industrial-gateway-latest.tar.gz.sha256 s3://arcnode-public/gateway/ems-industrial-gateway-latest.tar.gz.sha256
  only:
    - main

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/ems-industrial-gateway.git
  only:
    - main
